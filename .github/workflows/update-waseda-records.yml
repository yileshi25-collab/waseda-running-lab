name: Import Waseda official Hakone archive

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_waseda_records.py'
      - '.github/workflows/update-waseda-records.yml'
  schedule:
    - cron: '17 2 * * 3'

permissions:
  contents: write

concurrency:
  group: waseda-official-archive-sync
  cancel-in-progress: false

jobs:
  update-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Import official decade records
        run: python scripts/update_waseda_records.py
      - name: Commit verified archive
        run: |
          if git diff --quiet -- waseda-records-data.js; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add waseda-records-data.js
          git commit -m "Refresh verified Waseda Hakone history from official records"
          git push
